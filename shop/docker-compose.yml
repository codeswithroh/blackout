name: blackout-shop
x-image: &image
  build: ./app
  image: blackout-shop:local
services:
  payments:
    <<: *image
    command: uvicorn payments:app --host 0.0.0.0 --port 8101 --log-level warning
    env_file: ./state/payments.env
    ports: ["127.0.0.1:8101:8101"]
  shop:
    <<: *image
    command: uvicorn shop:app --host 0.0.0.0 --port 8100 --log-level warning
    env_file: ./state/shop.env
    restart: unless-stopped
    volumes: ["shopdata:/data"]
    ports: ["127.0.0.1:8100:8100"]
    depends_on: [payments]
  prober:
    <<: *image
    command: python prober.py
    ports: ["127.0.0.1:8102:8102"]
volumes:
  shopdata:
